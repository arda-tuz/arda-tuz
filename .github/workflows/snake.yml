name: Contribution snake

on:
  schedule:
    - cron: "17 3 * * *"        # off the top of the hour, UTC
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/snake.yml"]

permissions: {}                  # deny by default

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write           # only needed to push the output branch
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#1f2328&color_dots=#ebeef1,#fbe3b0,#f2b64f,#d9821a,#a14b07
            dist/snake-dark.svg?palette=github-dark&color_snake=#f0f6fc&color_dots=#161b22,#4a3410,#8a5e12,#d08a14,#fbbf24
      - name: Publish snake to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "Update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
