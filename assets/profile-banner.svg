<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Hüseyin Arda Tuz — AI Engineering and Computer Engineering</title>
  <desc id="desc">A dark technology-themed profile banner highlighting artificial intelligence, robotics, perception, data systems, and defense technologies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.52" stop-color="#0B1633"/>
      <stop offset="1" stop-color="#11103A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35D6ED"/>
      <stop offset="0.48" stop-color="#7A7CFF"/>
      <stop offset="1" stop-color="#C466FF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#35D6ED" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#35D6ED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A65CFF" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#A65CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#A9B9E8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="28" fill="url(#grid)"/>
  <ellipse cx="115" cy="105" rx="330" ry="260" fill="url(#glowA)"/>
  <ellipse cx="1260" cy="340" rx="410" ry="300" fill="url(#glowB)"/>

  <!-- Circuit paths -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1040 64h116l34 34h121" stroke="#35D6ED" stroke-opacity="0.42" stroke-width="2"/>
    <path d="M1115 126h78l31 31h129" stroke="#7A7CFF" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M1015 196h124l42 42h171" stroke="#C466FF" stroke-opacity="0.40" stroke-width="2"/>
    <path d="M1094 275h84l27 27h148" stroke="#35D6ED" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M995 342h140l25-25h192" stroke="#7A7CFF" stroke-opacity="0.38" stroke-width="2"/>
  </g>
  <g fill="#D7E6FF">
    <circle cx="1040" cy="64" r="4" opacity="0.70"/>
    <circle cx="1190" cy="98" r="4" opacity="0.75"/>
    <circle cx="1115" cy="126" r="4" opacity="0.75"/>
    <circle cx="1224" cy="157" r="4" opacity="0.75"/>
    <circle cx="1015" cy="196" r="4" opacity="0.72"/>
    <circle cx="1181" cy="238" r="4" opacity="0.72"/>
    <circle cx="1094" cy="275" r="4" opacity="0.68"/>
    <circle cx="1205" cy="302" r="4" opacity="0.68"/>
    <circle cx="995" cy="342" r="4" opacity="0.65"/>
    <circle cx="1160" cy="317" r="4" opacity="0.65"/>
  </g>

  <!-- Monogram -->
  <g transform="translate(78 64)">
    <rect width="70" height="70" rx="19" fill="#FFFFFF" fill-opacity="0.06" stroke="#8FEAFF" stroke-opacity="0.52"/>
    <path d="M19 19v32M19 35h32M51 19v32" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" filter="url(#softGlow)"/>
  </g>

  <text x="172" y="88" fill="#9AAEE0" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="3">AI ENGINEERING × COMPUTER ENGINEERING</text>
  <text x="78" y="181" fill="#FFFFFF" font-size="62" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" letter-spacing="-1.5">HÜSEYİN ARDA TUZ</text>
  <rect x="80" y="205" width="640" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="80" y="254" fill="#D9E3FF" font-size="25" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500">Building reliable intelligent systems from model to product.</text>
  <text x="80" y="289" fill="#9FB1DC" font-size="19" font-family="Inter, Segoe UI, Arial, sans-serif">Machine Learning · Robotics &amp; Perception · Data-Intensive Systems · Backend Engineering</text>

  <!-- Focus chips -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0.7">
    <g transform="translate(80 330)"><rect width="157" height="42" rx="21" fill="#35D6ED" fill-opacity="0.10" stroke="#35D6ED" stroke-opacity="0.55"/><text x="78.5" y="27" text-anchor="middle" fill="#8FEAFF">APPLIED AI</text></g>
    <g transform="translate(251 330)"><rect width="220" height="42" rx="21" fill="#7A7CFF" fill-opacity="0.10" stroke="#7A7CFF" stroke-opacity="0.55"/><text x="110" y="27" text-anchor="middle" fill="#BFC2FF">AUTONOMOUS SYSTEMS</text></g>
    <g transform="translate(485 330)"><rect width="151" height="42" rx="21" fill="#C466FF" fill-opacity="0.10" stroke="#C466FF" stroke-opacity="0.55"/><text x="75.5" y="27" text-anchor="middle" fill="#E0B5FF">DEFENSE TECH</text></g>
    <g transform="translate(650 330)"><rect width="146" height="42" rx="21" fill="#35D6ED" fill-opacity="0.08" stroke="#35D6ED" stroke-opacity="0.45"/><text x="73" y="27" text-anchor="middle" fill="#BCEEF5">ANKARA, TR</text></g>
  </g>

  <!-- Abstract intelligence node -->
  <g transform="translate(1168 204)" stroke="url(#accent)" fill="none" stroke-width="2.5" opacity="0.92">
    <circle r="75" stroke-opacity="0.35"/>
    <circle r="48" stroke-opacity="0.56"/>
    <circle r="17" fill="#11183E"/>
    <path d="M0-75V-48M0 48V75M-75 0H-48M48 0H75M-53-53l19 19M34 34l19 19M53-53L34-34M-34 34l-19 19"/>
    <g fill="#DCE8FF" stroke="none">
      <circle cy="-75" r="5"/><circle cy="75" r="5"/><circle cx="-75" r="5"/><circle cx="75" r="5"/>
      <circle cx="-53" cy="-53" r="5"/><circle cx="53" cy="53" r="5"/><circle cx="53" cy="-53" r="5"/><circle cx="-53" cy="53" r="5"/>
      <circle r="7" fill="#8FEAFF"/>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1398.5" height="418.5" rx="27.25" fill="none" stroke="#AFC2F6" stroke-opacity="0.18" stroke-width="1.5"/>
</svg>
