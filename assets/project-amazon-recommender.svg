<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Amazon Product Recommendation Using Spark</title>
  <desc id="desc">Project card for a gate-controlled Apache Spark recommendation platform with five models, hybrid ranking, and a responsive analytics interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1B1208"/><stop offset="0.53" stop-color="#38230B"/><stop offset="1" stop-color="#11243A"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF9D2E"/><stop offset="0.55" stop-color="#F66D3B"/><stop offset="1" stop-color="#4A9CFF"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#FFE0B7" stroke-opacity="0.045"/></pattern>
  </defs>
  <rect width="1200" height="260" rx="24" fill="url(#bg)"/><rect width="1200" height="260" rx="24" fill="url(#grid)"/>
  <rect x="0" y="0" width="10" height="260" rx="5" fill="url(#a)"/>
  <text x="52" y="54" fill="#FFC47D" font-size="15" font-weight="800" letter-spacing="2" font-family="Inter,Segoe UI,Arial">BIG DATA PROJECT · DISTRIBUTED RECOMMENDATION ENGINEERING</text>
  <text x="52" y="104" fill="#FFFFFF" font-size="35" font-weight="800" font-family="Inter,Segoe UI,Arial">Amazon Product Recommendation Using Spark</text>
  <text x="52" y="139" fill="#E2D0B8" font-size="18" font-family="Inter,Segoe UI,Arial">Bronze/Silver/Gold data products · Five recommenders · Weighted RRF · Leakage-safe evaluation</text>
  <g font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700">
    <g transform="translate(52 176)"><rect width="172" height="40" rx="20" fill="#FF9D2E" fill-opacity="0.13" stroke="#FF9D2E" stroke-opacity="0.58"/><text x="86" y="26" text-anchor="middle" fill="#FFD09A">548,552 PRODUCTS</text></g>
    <g transform="translate(238 176)"><rect width="145" height="40" rx="20" fill="#F66D3B" fill-opacity="0.13" stroke="#F66D3B" stroke-opacity="0.58"/><text x="72.5" y="26" text-anchor="middle" fill="#FFB09A">5 RECOMMENDERS</text></g>
    <g transform="translate(397 176)"><rect width="215" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.055" stroke="#EADCC9" stroke-opacity="0.25"/><text x="107.5" y="26" text-anchor="middle" fill="#E9DDCD">SPARK · DUCKDB · STREAMLIT</text></g>
  </g>
  <!-- Abstract pipeline visual -->
  <g transform="translate(880 49)" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800">
    <g stroke="url(#a)" stroke-width="3" fill="none"><path d="M35 81H81M121 81H167M207 81H253"/><path d="M75 75l6 6-6 6M161 75l6 6-6 6M247 75l6 6-6 6"/></g>
    <g><rect x="0" y="51" width="62" height="60" rx="14" fill="#FF9D2E" fill-opacity="0.13" stroke="#FF9D2E" stroke-opacity="0.65"/><text x="31" y="86" text-anchor="middle" fill="#FFD09A">RAW</text></g>
    <g><rect x="86" y="51" width="62" height="60" rx="14" fill="#F98238" fill-opacity="0.13" stroke="#F98238" stroke-opacity="0.65"/><text x="117" y="86" text-anchor="middle" fill="#FFBA91">B/S/G</text></g>
    <g><rect x="172" y="51" width="62" height="60" rx="14" fill="#A9774D" fill-opacity="0.16" stroke="#DAA060" stroke-opacity="0.62"/><text x="203" y="86" text-anchor="middle" fill="#F2CFA2">5× ML</text></g>
    <g><rect x="258" y="51" width="62" height="60" rx="14" fill="#4A9CFF" fill-opacity="0.13" stroke="#4A9CFF" stroke-opacity="0.65"/><text x="289" y="86" text-anchor="middle" fill="#A9D1FF">RRF</text></g>
    <text x="160" y="150" text-anchor="middle" fill="#B9C9DD" font-size="13">13-gate reproducible pipeline</text>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="258.5" rx="23.25" fill="none" stroke="#F5C790" stroke-opacity="0.18" stroke-width="1.5"/>
