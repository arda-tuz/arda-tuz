<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">AI-Powered Personal Financial Assistant</title>
  <desc id="desc">Project card for a full-stack financial decision-support platform using Mamba-2, FinBERT, Monte Carlo simulation, portfolio optimization, and RAG.</desc>
  <defs>
